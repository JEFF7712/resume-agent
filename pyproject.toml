[project]
name = "resume-agent"
version = "0.1.0"
description = "Closed-loop LaTeX resume harness for coding agents"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  "pyright",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises installed external toolchains"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
include = ["hooks", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
